name: Build NaptirWaveQueue
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: NaptirWaveQueue-1.0.0
          path: target/NaptirWaveQueue-1.0.0.jar
